<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Ticket Details - Zendesk Dashboard</title>
    <link href="./original/dist/css/tabler.css?1747674014" rel="stylesheet" />
    <link href="./original/dist/css/tabler-flags.css?1747674014" rel="stylesheet" />
    <link href="./original/dist/css/tabler-vendors.css?1747674014" rel="stylesheet" />
    <style>
      @import url("https://rsms.me/inter/inter.css");
      body { 
        font-family: 'Inter', sans-serif; 
        background: #f5f7fb;
      }
      
      .ticket-header {
        background: linear-gradient(135deg, #206bc4 0%, #4299e1 100%);
        color: white;
        padding: 30px;
        border-radius: 12px;
        margin-bottom: 30px;
        box-shadow: 0 4px 12px rgba(32, 107, 196, 0.2);
      }
      
      .ticket-id-badge {
        display: inline-block;
        background: rgba(255,255,255,0.2);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 10px;
        backdrop-filter: blur(10px);
      }
      
      .ticket-subject {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 10px 0;
        line-height: 1.3;
      }
      
      .ticket-meta {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 15px;
        opacity: 0.95;
      }
      
      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
      }
      
      .status-badge {
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: capitalize;
      }
      
      .status-new { background: #d3f9e3; color: #2fb344; }
      .status-open { background: #fff3bf; color: #f59f00; }
      .status-pending { background: #fef2e5; color: #fd7e14; }
      .status-hold { background: #fce8e6; color: #e8590c; }
      .status-solved { background: #d8f5e8; color: #12b886; }
      .status-closed { background: #e6e8eb; color: #495057; }
      
      .priority-badge {
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: capitalize;
      }
      
      .priority-low { background: #e9ecef; color: #6c757d; }
      .priority-normal { background: #e7f5ff; color: #206bc4; }
      .priority-high { background: #fff3bf; color: #f59f00; }
      .priority-urgent { background: #ffe5e5; color: #dc3545; }
      
      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      
      .info-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        border-left: 4px solid #206bc4;
      }
      
      .info-label {
        font-size: 0.8rem;
        color: #6c757d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        font-weight: 600;
      }
      
      .info-value {
        font-size: 1.1rem;
        font-weight: 600;
        color: #212529;
      }
      
      .timeline-container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      }
      
      .timeline-header {
        font-size: 1.5rem;
        font-weight: 700;
        color: #212529;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      
      .timeline {
        position: relative;
        padding-left: 40px;
      }
      
      .timeline::before {
        content: '';
        position: absolute;
        left: 15px;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, #206bc4 0%, #e9ecef 100%);
      }
      
      .timeline-event {
        position: relative;
        margin-bottom: 30px;
        padding-bottom: 30px;
        border-bottom: 1px solid #f0f0f0;
      }
      
      .timeline-event:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      
      .timeline-event::before {
        content: '';
        position: absolute;
        left: -30px;
        top: 5px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: white;
        border: 3px solid #206bc4;
        box-shadow: 0 0 0 4px rgba(32, 107, 196, 0.1);
      }
      
      .timeline-event.created::before { border-color: #2fb344; background: #d3f9e3; }
      .timeline-event.status_change::before { border-color: #206bc4; background: #e7f5ff; }
      .timeline-event.assignment::before { border-color: #f59f00; background: #fff3bf; }
      .timeline-event.comment::before { border-color: #6c757d; background: #e9ecef; }
      .timeline-event.priority_change::before { border-color: #dc3545; background: #ffe5e5; }
      
      .event-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 10px;
      }
      
      .event-type {
        font-weight: 700;
        font-size: 1.05rem;
        color: #212529;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .event-timestamp {
        font-size: 0.85rem;
        color: #6c757d;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      
      .event-description {
        font-size: 0.95rem;
        color: #495057;
        margin-bottom: 8px;
        line-height: 1.5;
      }
      
      .event-details {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 12px;
      }
      
      .detail-item {
        font-size: 0.85rem;
        background: #f8f9fa;
        padding: 6px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      
      .detail-label {
        color: #6c757d;
        font-weight: 500;
      }
      
      .detail-value {
        color: #212529;
        font-weight: 600;
      }
      
      .duration-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: #fff3bf;
        color: #856404;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      
      .comment-body {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        font-size: 0.9rem;
        line-height: 1.6;
        color: #495057;
        border-left: 3px solid #dee2e6;
      }
      
      .loading-state {
        text-align: center;
        padding: 60px 20px;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e9ecef;
        border-top-color: #206bc4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .error-state {
        text-align: center;
        padding: 60px 20px;
        color: #dc3545;
      }
      
      .total-duration {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        text-align: center;
      }
      
      .total-duration-label {
        font-size: 0.9rem;
        color: #6c757d;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      
      .total-duration-value {
        font-size: 2rem;
        font-weight: 700;
        color: #206bc4;
      }
      
      .arrow-icon {
        color: #6c757d;
        margin: 0 8px;
      }
      
      .value-changed {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      
      .old-value {
        padding: 4px 10px;
        background: #ffe5e5;
        color: #dc3545;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: line-through;
      }
      
      .new-value {
        padding: 4px 10px;
        background: #d3f9e3;
        color: #2fb344;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <script src="./original/dist/js/tabler-theme.min.js?1747674014"></script>
    <div class="page">
      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            <div id="content-container">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading ticket details...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="./original/dist/js/tabler.min.js?1747674014"></script>
    <script>
      const app = {
        API_BASE_URL: window.location.port === '5501' ? 'http://localhost:3000' : window.location.origin,
        ticketId: null,
        
        init() {
          // Get ticket ID from URL parameter
          const urlParams = new URLSearchParams(window.location.search);
          this.ticketId = urlParams.get('id');
          
          if (!this.ticketId) {
            this.showError('No ticket ID provided');
            return;
          }
          
          console.log(`🎫 Loading ticket details for ID: ${this.ticketId}`);
          this.loadTicketDetails();
        },
        
        async loadTicketDetails() {
          try {
            const response = await fetch(`${this.API_BASE_URL}/api/tickets/details?id=${this.ticketId}`);
            const data = await response.json();
            
            if (!data.success) {
              throw new Error(data.error || 'Failed to load ticket details');
            }
            
            console.log('✅ Ticket data loaded:', data);
            this.renderTicketDetails(data);
            
          } catch (error) {
            console.error('❌ Error loading ticket:', error);
            this.showError(error.message || 'Failed to load ticket details');
          }
        },
        
        renderTicketDetails(data) {
          const container = document.getElementById('content-container');
          const ticket = data.ticket;
          const timeline = data.timeline;
          
          container.innerHTML = `
            <!-- Ticket Header -->
            <div class="ticket-header">
              <div class="ticket-id-badge">🎫 Ticket #${ticket.id}</div>
              <div class="ticket-subject">${this.escapeHtml(ticket.subject)}</div>
              <div class="ticket-meta">
                <div class="meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                    <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                  </svg>
                  <strong>Requester:</strong> ${this.escapeHtml(ticket.requester)}
                </div>
                <div class="meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                    <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                  </svg>
                  <strong>Assignee:</strong> ${this.escapeHtml(ticket.assignee)}
                </div>
                <div class="meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  ${this.formatDateTime(ticket.created_at)}
                </div>
              </div>
            </div>
            
            <!-- Info Grid -->
            <div class="info-grid">
              <div class="info-card">
                <div class="info-label">Status</div>
                <div class="info-value">
                  <span class="status-badge status-${ticket.status}">${ticket.status}</span>
                </div>
              </div>
              <div class="info-card">
                <div class="info-label">Priority</div>
                <div class="info-value">
                  <span class="priority-badge priority-${ticket.priority}">${ticket.priority}</span>
                </div>
              </div>
              <div class="info-card">
                <div class="info-label">Channel</div>
                <div class="info-value">${this.getChannelIcon(ticket.channel)} ${ticket.channel}</div>
              </div>
              <div class="info-card">
                <div class="info-label">Total Events</div>
                <div class="info-value">${data.total_events}</div>
              </div>
            </div>
            
            <!-- Timeline -->
            <div class="timeline-container">
              <div class="timeline-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Timeline
              </div>
              
              <div class="timeline">
                ${this.renderTimeline(timeline)}
              </div>
              
              <div class="total-duration">
                <div class="total-duration-label">Total Resolution Time</div>
                <div class="total-duration-value">${this.formatDuration(data.total_duration)}</div>
              </div>
            </div>
          `;
        },
        
        renderTimeline(timeline) {
          return timeline.map((event, index) => {
            const durationHtml = event.duration_from_previous > 0 
              ? `<span class="duration-badge">
                   <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                     <circle cx="12" cy="12" r="9"></circle>
                     <polyline points="12 6 12 12 16 14"></polyline>
                   </svg>
                   +${this.formatDuration(event.duration_from_previous)}
                 </span>`
              : '';
            
            let detailsHtml = '';
            if (event.type === 'status_change' || event.type === 'assignment' || event.type === 'priority_change') {
              detailsHtml = `
                <div class="value-changed">
                  <span class="old-value">${this.escapeHtml(event.old_value)}</span>
                  <span class="arrow-icon">→</span>
                  <span class="new-value">${this.escapeHtml(event.new_value)}</span>
                </div>
              `;
            }
            
            if (event.type === 'comment' && event.body) {
              detailsHtml = `<div class="comment-body">${this.escapeHtml(event.body).substring(0, 200)}${event.body.length > 200 ? '...' : ''}</div>`;
            }
            
            return `
              <div class="timeline-event ${event.type}">
                <div class="event-header">
                  <div class="event-type">
                    ${this.getEventIcon(event.type)}
                    ${this.getEventTitle(event.type)}
                  </div>
                  <div class="event-timestamp">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="9"></circle>
                      <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    ${this.formatDateTime(event.timestamp)}
                    ${durationHtml}
                  </div>
                </div>
                <div class="event-description">${this.escapeHtml(event.description)}</div>
                <div class="event-details">
                  <div class="detail-item">
                    <span class="detail-label">By:</span>
                    <span class="detail-value">${this.escapeHtml(event.author)}</span>
                  </div>
                </div>
                ${detailsHtml}
              </div>
            `;
          }).join('');
        },
        
        getEventIcon(type) {
          const icons = {
            created: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>',
            status_change: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1"></path></svg>',
            assignment: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path></svg>',
            comment: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l1.3 -3.9a9 8 0 1 1 3.4 2.9l-4.7 1"></path></svg>',
            priority_change: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"></path></svg>'
          };
          return icons[type] || '';
        },
        
        getEventTitle(type) {
          const titles = {
            created: 'Ticket Created',
            status_change: 'Status Changed',
            assignment: 'Reassigned',
            comment: 'Comment Added',
            priority_change: 'Priority Changed'
          };
          return titles[type] || type;
        },
        
        getChannelIcon(channel) {
          const icons = {
            email: '📧',
            voice: '📞',
            web: '🌐',
            chat: '💬',
            api: '🔌'
          };
          return icons[channel] || '📝';
        },
        
        formatDateTime(timestamp) {
          const date = new Date(timestamp);
          return date.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          });
        },
        
        formatDuration(seconds) {
          if (!seconds || seconds === 0) return '0s';
          
          const days = Math.floor(seconds / 86400);
          const hours = Math.floor((seconds % 86400) / 3600);
          const minutes = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          
          const parts = [];
          if (days > 0) parts.push(`${days}d`);
          if (hours > 0) parts.push(`${hours}h`);
          if (minutes > 0) parts.push(`${minutes}m`);
          if (secs > 0 || parts.length === 0) parts.push(`${secs}s`);
          
          return parts.join(' ');
        },
        
        escapeHtml(text) {
          if (!text) return '';
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        },
        
        showError(message) {
          const container = document.getElementById('content-container');
          container.innerHTML = `
            <div class="error-state">
              <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 20px;">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
              </svg>
              <h3>Error Loading Ticket</h3>
              <p>${this.escapeHtml(message)}</p>
              <button class="btn btn-primary mt-3" onclick="window.close()">Close Window</button>
            </div>
          `;
        }
      };
      
      document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
  </body>
</html>
